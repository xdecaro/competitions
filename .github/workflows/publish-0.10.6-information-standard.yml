name: Publish Competitions 0.10.6 Information standard

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-0.10.6-information-standard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.10.6"

      - name: Stop if release already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.10.6 >/dev/null 2>&1; then
            echo "Competitions v0.10.6 already exists."
            exit 1
          fi

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          find component modules plugins package -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check component/media/js/filterbar.js
          node --check component/media/js/information.js
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in Path('.').rglob('*.xml'):
              if '.git' not in p.parts:
                  ET.parse(p)
          PY
          python3 tools/validate_release.py

      - name: Build and validate packages
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build.py
          python3 tools/update_feed_checksum.py
          PACKAGE="dist/pkg_decarodcl_0.10.6.zip"
          SHA256="$(sha256sum "$PACKAGE" | awk '{print $1}')"
          grep -q "<sha256>${SHA256}</sha256>" updates/pkg_decarodcl.xml
          python3 tools/validate_release.py --dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.10.6 dist/*.zip dist/SHA256SUMS.txt \
            --title "Competitions 0.10.6" \
            --notes "Competitions 0.10.6 — pagina Informazioni uniformata allo standard xdecaro approvato, con Integrazioni e Diagnostica complete."

      - name: Publish update-feed checksum
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/pkg_decarodcl.xml
          if git diff --cached --quiet; then
            echo "Update feed checksum already current."
            exit 0
          fi
          git commit -m "Publish SHA-256 for Competitions 0.10.6"
          git pull --rebase origin main
          git push origin HEAD:main
