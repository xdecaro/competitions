name: Temporary Competitions DB Prefix Rewrite

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/db-prefix-rewrite-main.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/competitions-db-prefix
          fetch-depth: 0
      - name: Transform branch
        run: python3 tools/db_prefix_reset.py
      - name: Validate transformed branch
        shell: bash
        run: |
          set -euo pipefail
          find component modules plugins package -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 tools/validate_release.py
          python3 tools/build.py
          python3 tools/validate_release.py --dist
          VERSION="$(cat VERSION)"
          test -f "dist/pkg_competitions_${VERSION}.zip"
      - name: Commit transformed branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebase Competitions database storage for 0.13.0"
          git push origin HEAD:cleanup/competitions-db-prefix
