name: Competitions CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find component modules plugins package -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: node --check component/media/js/filterbar.js
      - name: XML syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in Path('.').rglob('*.xml'):
              if '.git' in p.parts: continue
              ET.parse(p)
              print('OK', p)
          PY
      - name: Release metadata consistency
        run: python3 tools/validate_release.py
      - name: Build packages
        run: python3 tools/build.py
      - name: Verify filterbar package assets
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          unzip -l "dist/com_decarodcl_${VERSION}.zip" | grep -q 'media/css/filterbar.css'
          unzip -l "dist/com_decarodcl_${VERSION}.zip" | grep -q 'media/js/filterbar.js'
      - name: Synchronize Joomla update checksum
        run: python3 tools/update_feed_checksum.py
      - name: Verify Joomla update checksum
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          PACKAGE="dist/pkg_decarodcl_${VERSION}.zip"
          SHA256="$(sha256sum "$PACKAGE" | awk '{print $1}')"
          grep -q "<sha256>${SHA256}</sha256>" updates/pkg_decarodcl.xml
      - name: Package contents
        run: python3 tools/validate_release.py --dist
