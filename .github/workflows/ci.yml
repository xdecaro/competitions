name: Competitions CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        run: find component modules plugins package -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax
        run: find component modules plugins -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: XML syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('.').rglob('*.xml'):
              if '.git' in path.parts or 'dist' in path.parts:
                  continue
              ET.parse(path)
              print('OK', path)
          PY

      - name: Source and metadata validation
        run: python3 tools/validate_release.py

      - name: Deterministic build A
        run: |
          set -euo pipefail
          python3 tools/build.py
          cp dist/SHA256SUMS.txt /tmp/competitions-sha-a.txt

      - name: Deterministic build B
        run: |
          set -euo pipefail
          rm -rf dist
          python3 tools/build.py
          diff -u /tmp/competitions-sha-a.txt dist/SHA256SUMS.txt

      - name: Distribution validation
        run: python3 tools/validate_release.py --dist

      - name: Verify Core integration and package identity
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          COMPONENT="dist/com_xdecarocompetitions_${VERSION}.zip"
          PACKAGE="dist/pkg_xdecarocompetitions_${VERSION}.zip"
          unzip -p "$COMPONENT" media/joomla.asset.json | grep -Fq '"com_xdecarocompetitions.core-bridge"'
          unzip -p "$COMPONENT" admin/src/Service/CoreIntegrationService.php | grep -Fq 'com_xdecarocompetitions'
          unzip -p "$COMPONENT" admin/tmpl/information/core.php | grep -Fq 'xdecaro-scope competitions-core-scope'
          unzip -p "$COMPONENT" admin/sql/install.mysql.utf8mb4.sql | grep -Fq '#__xdecarocompetitions_'
          unzip -l "$PACKAGE" | grep -Fq "com_xdecarocompetitions_${VERSION}.zip"
          unzip -l "$PACKAGE" | grep -Fq "plg_system_xdecarocompetitions_${VERSION}.zip"
