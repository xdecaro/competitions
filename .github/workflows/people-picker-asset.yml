name: Competitions People picker asset

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asset-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify People picker Joomla asset path
        run: php tests/people-picker-asset-contract.php
