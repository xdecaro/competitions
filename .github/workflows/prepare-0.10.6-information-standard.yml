name: Prepare Competitions 0.10.6 Information standard

on:
  push:
    branches: [main]
    paths:
      - "tools/release-0.10.6-information-standard.sh"
      - ".github/workflows/prepare-0.10.6-information-standard.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply and validate 0.10.6
        shell: bash
        run: bash tools/release-0.10.6-information-standard.sh

      - name: Commit coherent 0.10.6 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The preparation script validates information.js itself. Keep CI/release
          # workflow files unchanged because the Actions token cannot push workflow edits.
          git checkout -- .github/workflows/ci.yml .github/workflows/release.yml
          git add VERSION CHANGELOG.md README.md \
                  component package plugins modules updates tools/validate_release.py
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "Standardize Competitions 0.10.6 Information page"
          git push origin HEAD:main
