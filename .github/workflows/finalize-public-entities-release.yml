name: Finalize Public Entities Release Metadata

on:
  push:
    branches: [feature/public-builder-data-api]
    paths:
      - tools/finalize_public_entities_release.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-builder-data-api
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Finalize metadata
        run: python3 tools/finalize_public_entities_release.py
      - name: Verify source
        run: |
          php tests/public-builder-data-service-contract.php
          php tests/public-builder-entities-contract.php
          python3 tools/validate_release.py --source
          find component package plugins modules tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Build and verify distribution
        run: |
          rm -rf dist
          python3 tools/build.py
          python3 tools/validate_release.py --dist
      - name: Commit finalized metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md updates/pkg_xdecarocompetitions.xml
          git diff --cached --quiet || git commit -m "docs: finalize competitions 1.5.24 metadata"
          git push origin HEAD:feature/public-builder-data-api
