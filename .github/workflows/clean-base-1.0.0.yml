name: Temporary Competitions Clean Base 1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-base-1.0.0.yml'

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: clean-base-1.0.0
          fetch-depth: 0
      - name: Apply clean identity reset
        run: |
          set -euo pipefail
          python3 tools/clean_base_reset.py
          python3 tools/clean_base_reset_fix.py
          python3 tools/clean_base_reset_validation_fix.py
          rm tools/clean_base_reset.py tools/clean_base_reset_fix.py tools/clean_base_reset_validation_fix.py
      - name: PHP syntax
        run: find component modules plugins package -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: XML syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('.').rglob('*.xml'):
              if '.git' in path.parts or 'dist' in path.parts:
                  continue
              ET.parse(path)
              print('OK', path)
          PY
      - name: Validate clean source
        run: python3 tools/validate_release.py
      - name: Verify deterministic build
        run: |
          set -euo pipefail
          python3 tools/build.py
          A="$(sha256sum dist/pkg_xdecarocompetitions_1.0.0.zip | awk '{print $1}')"
          rm -rf dist
          python3 tools/build.py
          B="$(sha256sum dist/pkg_xdecarocompetitions_1.0.0.zip | awk '{print $1}')"
          test "$A" = "$B"
          python3 tools/validate_release.py --dist
      - name: Verify canonical identity
        run: |
          set -euo pipefail
          grep -Fq '<name>COM_XDECAROCOMPETITIONS</name>' component/xdecarocompetitions.xml
          grep -Fq '<packagename>xdecarocompetitions</packagename>' package/pkg_xdecarocompetitions.xml
          grep -Fq '#__xdecarocompetitions_' component/admin/sql/install.mysql.utf8mb4.sql
          grep -Fq 'com_xdecarocompetitions' component/admin/src/Service/CoreIntegrationService.php
      - name: Commit clean branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Establish clean Competitions by xdecaro 1.0.0 identity'
          git push origin HEAD:clean-base-1.0.0
