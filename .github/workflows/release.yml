name: Competitions Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.version.outputs.version }} already exists." >&2
            exit 1
          fi

      - name: Validate source
        run: |
          set -euo pipefail
          find component modules plugins package -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 tools/validate_release.py

      - name: Build twice and verify determinism
        run: |
          set -euo pipefail
          python3 tools/build.py
          cp dist/SHA256SUMS.txt /tmp/competitions-sha-a.txt
          rm -rf dist
          python3 tools/build.py
          diff -u /tmp/competitions-sha-a.txt dist/SHA256SUMS.txt
          python3 tools/validate_release.py --dist

      - name: Publish update-feed checksum
        run: |
          set -euo pipefail
          python3 tools/update_feed_checksum.py
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE="dist/pkg_xdecarocompetitions_${VERSION}.zip"
          SHA256="$(sha256sum "$PACKAGE" | awk '{print $1}')"
          grep -Fq "<sha256>${SHA256}</sha256>" updates/pkg_xdecarocompetitions.xml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/pkg_xdecarocompetitions.xml
          if ! git diff --cached --quiet; then
            git commit -m "Publish SHA-256 for Competitions $VERSION"
            git push origin HEAD:main
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" \
            "dist/com_xdecarocompetitions_${VERSION}.zip" \
            "dist/plg_system_xdecarocompetitions_${VERSION}.zip" \
            "dist/mod_xdecarocompetitions_matchtimeline_${VERSION}.zip" \
            "dist/mod_xdecarocompetitions_countriesfederations_${VERSION}.zip" \
            "dist/pkg_xdecarocompetitions_${VERSION}.zip" \
            "dist/SHA256SUMS.txt" \
            --target main \
            --title "Competitions by xdecaro ${VERSION}" \
            --notes "Clean Competitions by xdecaro 1.0.0 technical baseline. Fresh install only: com_xdecarocompetitions, pkg_xdecarocompetitions, Xdecaro\\Component\\Competitions and #__xdecarocompetitions_* database tables. Core by xdecaro integration is preserved; competition-domain behavior remains in Competitions."
