name: Competitions Release

on:
  push:
    branches: [main]
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Stop if version already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.version.outputs.version }} already exists. Bump VERSION before publishing changed files."
            exit 1
          fi
      - name: PHP syntax
        run: find component modules plugins package -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: node --check component/media/js/filterbar.js
      - name: XML syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for p in Path('.').rglob('*.xml'):
              if '.git' in p.parts: continue
              ET.parse(p)
          PY
      - name: Release metadata consistency
        run: python3 tools/validate_release.py
      - name: Build
        run: python3 tools/build.py
      - name: Verify filterbar package assets
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          unzip -l "dist/com_decarodcl_${VERSION}.zip" | grep -q 'media/css/filterbar.css'
          unzip -l "dist/com_decarodcl_${VERSION}.zip" | grep -q 'media/js/filterbar.js'
      - name: Synchronize Joomla update checksum
        run: python3 tools/update_feed_checksum.py
      - name: Verify Joomla update checksum
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE="dist/pkg_decarodcl_${VERSION}.zip"
          SHA256="$(sha256sum "$PACKAGE" | awk '{print $1}')"
          grep -q "<sha256>${SHA256}</sha256>" updates/pkg_decarodcl.xml
      - name: Package contents
        run: python3 tools/validate_release.py --dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" dist/*.zip dist/SHA256SUMS.txt --title "Competitions ${VERSION}" --notes "Competitions ${VERSION}"
      - name: Publish update-feed checksum
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/pkg_decarodcl.xml
          if git diff --cached --quiet; then
            echo "Update feed checksum already current."
            exit 0
          fi
          git commit -m "Publish SHA-256 for Competitions ${VERSION}"
          git pull --rebase origin main
          git push origin HEAD:main
