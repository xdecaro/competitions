name: Joomla 6-only docs

on:
  push:
    branches: [feature/draw-integration-1.6.0]
    paths:
      - '.github/workflows/joomla6-only-docs.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/draw-integration-1.6.0
      - name: Make Joomla baseline explicit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          old = 'The current Competitions 1.x line targets Joomla 6 and PHP 8.3+. Compatibility with earlier Joomla versions is not claimed until runtime-tested.'
          new = 'The current Competitions 1.x line targets Joomla 6 only and PHP 8.3+. Joomla 4 and Joomla 5 are not supported. The verified runtime baseline is Joomla 6.1.3.'
          if old not in text:
              raise SystemExit('Expected Joomla baseline text not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: make Competitions Joomla 6 only'
          git push origin HEAD:feature/draw-integration-1.6.0
