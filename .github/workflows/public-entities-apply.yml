name: Apply Public Entities Service Patch

on:
  push:
    branches: [feature/public-builder-data-api]
    paths:
      - tools/apply_public_entities_patch.py
  pull_request:
    branches: [main]
    paths:
      - tools/apply_public_entities_patch.py
      - .github/workflows/public-entities-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/public-builder-data-api' || github.ref == 'refs/heads/feature/public-builder-data-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/public-builder-data-api
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', coverage: none}
      - name: Apply focused service patch
        run: python3 tools/apply_public_entities_patch.py
      - name: Verify contracts and syntax
        run: |
          php tests/public-builder-data-service-contract.php
          php tests/public-builder-entities-contract.php
          php -l component/admin/src/Service/PublicBuilderDataService.php
      - name: Commit generated service change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add component/admin/src/Service/PublicBuilderDataService.php
          git diff --cached --quiet || git commit -m "feat: expose public federation team roster data"
          git push origin HEAD:feature/public-builder-data-api
